<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png">
    <title>Gallery</title>
    <meta name="title" content="FluffyMawds | Work in Progress">
    <meta name="description" content="Amy is a Chud">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://demo.fluffymawds.my.id/gallery">
    <meta property="og:title" content="FluffyMawds | Work in Progress">
    <meta property="og:description" content="Amy is a chud">
    <meta property="og:image" content="https://demo.fluffymawds.my.id/favicon.png">
    <meta property="og:image:alt" content="FluffyMawds">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:url"content="https://demo.fluffymawds.my.id/favicon.png">
    <meta property="og:image:secure_url" content="https://demo.fluffymawds.my.id/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="./css/style.css" rel="stylesheet" />
  </head>
  <body class="font-body min-h-screen bg-brand-body text-slate-200 antialiased selection:bg-pink-500/30 selection:text-white">
    <div class="flex items-center justify-center p-6">
        <div class="w-full max-w-9/10 overflow-hidden rounded-[3rem] border border-slate-700/40 bg-slate-900/20 shadow-2xl backdrop-blur-md flex flex-col">
            <header class="bg-brand-footer p-6 text-center shrink-0">
            <h1 class="font-display text-5xl font-bold tracking-wide text-white md:text-6xl">GALLERY</h1>
            <p class="mt-3 text-2xl font-bold italic underline text-white">Fuck AI Bot Scrapper</p>
            <nav class="footer-nav pt-6">
                <a href="/" class="footer-nav-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5" />
                    <path d="m12 19-7-7 7-7" />
                </svg>
                Back to Main
                </a>
            </nav>
            </header>

            <main class="bg-brand-grid px-8 py-6 text-center flex-1 min-h-0 flex flex-col">           
                
                <div id="filter-buttons" class="mb-8 flex flex-wrap justify-center gap-3 shrink-0">
                    <button data-tag="All" class="filter-btn px-5 py-2 rounded-full text-sm font-medium tracking-wide bg-pink-600 text-white shadow-lg transition duration-200 transform hover:scale-105 cursor-pointer">All Artworks</button>
                    <button data-tag="Commission" class="filter-btn px-5 py-2 rounded-full text-sm font-medium tracking-wide bg-slate-800/60 hover:bg-slate-700/80 border border-slate-700/30 text-slate-300 transition duration-200 transform hover:scale-105 cursor-pointer">Commission</button>
                    <button data-tag="Personal" class="filter-btn px-5 py-2 rounded-full text-sm font-medium tracking-wide bg-slate-800/60 hover:bg-slate-700/80 border border-slate-700/30 text-slate-300 transition duration-200 transform hover:scale-105 cursor-pointer">Personal</button>
                    <button data-tag="Fan-art" class="filter-btn px-5 py-2 rounded-full text-sm font-medium tracking-wide bg-slate-800/60 hover:bg-slate-700/80 border border-slate-700/30 text-slate-300 transition duration-200 transform hover:scale-105 cursor-pointer">Fan-art</button>
                </div>

                <div id="gallery-container" class="w-full columns-1 sm:columns-2 md:columns-3 lg:columns-4 gap-2 text-left overflow-y-auto pr-1 flex-1 min-h-auto block">
                </div>

            </main>

            <footer class="bg-brand-footer p-6 text-center shrink-0">
            <p class="text-sm text-teal-50/90 font-medium">Made with 💜 and a lot of coffee ☕</p>
            <p class="text-sm text-teal-50/90 font-medium">Developed and maintained by Cheesky</p>
            </footer>

        </div>
    </div>
    <script src="./js/lightbox.js"></script>
    <script src="./js/gallery.js"></script>
  </body>
</html>
